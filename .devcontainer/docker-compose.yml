services:
  app:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    volumes:
      - ..:/workspaces/RugbyEngine:cached
      - gitobjects:/git-store
    command: sleep infinity
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: rugbyengine
      DB_USER: postgres
      DB_PASS: rugbyengine

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rugbyengine
      POSTGRES_DB: rugbyengine
    ports:
      - "5545:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    name: rugbyengine_dev_pgdata
  gitobjects:
    name: rugbyengine_git_objects
