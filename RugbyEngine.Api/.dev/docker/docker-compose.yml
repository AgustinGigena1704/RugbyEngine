services:
  postgres:
    image: postgres:17-alpine
    container_name: rugbyengine_dev_db
    environment:
      POSTGRES_DB: rugbyengine_dev
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5433:5432"
    volumes:
      - rugbyengine_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev_user -d rugbyengine_dev"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  rugbyengine_dev_data:
    name: rugbyengine_dev_data