services:

  rugbyengine:
    image: ${RUGBYENGINE_IMAGE:-rugbyengine:latest}
    ports:
      - "127.0.0.1:8080:8080"   # solo accesible desde localhost → Caddy hace el proxy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DB_HOST:               ${DB_HOST}
      DB_PORT:               ${DB_PORT}
      DB_NAME:               ${DB_NAME}
      DB_USER:               ${DB_USER}
      DB_PASS:               ${DB_PASS}
      DB_CERTIFICATE_PATH:   /app/Secrets/db.pem
      JWT_ISSUER:            ${JWT_ISSUER}
      JWT_AUDIENCE:          ${JWT_AUDIENCE}
      JWT_SECRET_KEY:        ${JWT_SECRET_KEY}
    volumes:
      - ./Secrets/db.pem:/app/Secrets/db.pem:ro
    restart: unless-stopped
