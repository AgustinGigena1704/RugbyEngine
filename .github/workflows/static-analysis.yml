name: 🔍 Static Analysis

on:
  pull_request:
  push:
    branches:
      - production
  workflow_dispatch:

# Cancel any in-progress run for the same PR or branch when a new commit is pushed.
# This eliminates the duplicate execution that occurs when both the push event
# and the pull_request:synchronize event fire simultaneously for the same commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # GROUP 1 — Quality & Security (run in parallel)
  # Both must pass before the format job is allowed to run.
  # ───────────────────────────────────────────────────────────────────────────

  codeql:
    name: 🔒 CodeQL Security Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          # security-and-quality: security vulnerabilities + code quality rules
          queries: security-and-quality

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build for CodeQL
        run: dotnet build RugbyEngine.slnx

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:csharp"

  build-and-audit:
    name: 🧱 Build & Roslyn · 📦 NuGet Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore RugbyEngine.slnx

      - name: Build (Release — TreatWarningsAsErrors)
        run: dotnet build RugbyEngine.slnx --no-restore --configuration Release

      - name: Audit vulnerable packages
        # Exits with code 1 if any vulnerability is found (.NET 8+)
        run: dotnet list RugbyEngine.slnx package --vulnerable --include-transitive

  # ───────────────────────────────────────────────────────────────────────────
  # GROUP 2 — Code Style (sequential: only runs if Group 1 fully passes)
  #
  # Configuration
  #   • Formatting rules  → edit .editorconfig at the repo root
  #   • Files to analyse  → edit FORMAT_INCLUDE / FORMAT_EXCLUDE below
  #
  # PRs:        auto-fix → commit → fail so the workflow re-runs on the new commit
  # production: verify only → fail (no auto-commit; dev must fix locally)
  #
  # Requires secret GH_PAT (repo scope) for the auto-commit to re-trigger
  # this workflow. Without GH_PAT the fix is committed but will NOT re-trigger
  # (GitHub limitation with GITHUB_TOKEN commits).
  # ───────────────────────────────────────────────────────────────────────────

  style:
    name: 🎨 Code Style
    runs-on: ubuntu-latest
    needs: [codeql, build-and-audit]
    # Skipped automatically by needs semantics when Group 1 fails.
    # Also skipped on workflow_dispatch (no code changes to review).
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/production'
    permissions:
      contents: write
    env:
      # ── File patterns ───────────────────────────────────────────────────
      # One glob pattern per line. These are passed to dotnet format as
      # --include / --exclude flags. Blank lines are ignored.
      # Formatting rules themselves live in .editorconfig at the repo root.
      FORMAT_INCLUDE: |
        **/*.cs
        **/*.razor
      FORMAT_EXCLUDE: |
        **/Migrations/**
        **/obj/**
        **/bin/**
    steps:
      - uses: actions/checkout@v4
        with:
          # GH_PAT re-triggers the workflow on the auto-commit; GITHUB_TOKEN won't
          token: ${{ secrets.GH_PAT || github.token }}
          ref: ${{ github.head_ref || github.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore RugbyEngine.slnx

      - name: Check code style
        id: fmt
        # Build --include / --exclude flags from the env vars above.
        # set -f disables shell glob expansion so patterns are passed literally.
        run: |
          set -f
          INCLUDE_FLAGS=$(echo "$FORMAT_INCLUDE" | grep -v '^[[:space:]]*$' | sed 's/^[[:space:]]*//' | sed 's/^/--include /' | tr '\n' ' ')
          EXCLUDE_FLAGS=$(echo "$FORMAT_EXCLUDE" | grep -v '^[[:space:]]*$' | sed 's/^[[:space:]]*//' | sed 's/^/--exclude /' | tr '\n' ' ')
          dotnet format whitespace RugbyEngine.slnx --verify-no-changes $INCLUDE_FLAGS $EXCLUDE_FLAGS
        continue-on-error: true

      # Auto-fix only on PRs — cannot push to a protected production branch
      - name: Apply style fixes
        if: steps.fmt.outcome == 'failure' && github.event_name == 'pull_request'
        run: |
          set -f
          INCLUDE_FLAGS=$(echo "$FORMAT_INCLUDE" | grep -v '^[[:space:]]*$' | sed 's/^[[:space:]]*//' | sed 's/^/--include /' | tr '\n' ' ')
          EXCLUDE_FLAGS=$(echo "$FORMAT_EXCLUDE" | grep -v '^[[:space:]]*$' | sed 's/^[[:space:]]*//' | sed 's/^/--exclude /' | tr '\n' ' ')
          dotnet format whitespace RugbyEngine.slnx $INCLUDE_FLAGS $EXCLUDE_FLAGS

      - name: Commit auto-style fixes
        if: steps.fmt.outcome == 'failure' && github.event_name == 'pull_request'
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          git diff --staged --quiet \
            && echo "No changes to commit" \
            || (git commit -m "style: auto-format whitespace [github-actions]" && git push)

      # Fail in both scenarios — ensures deploy is always blocked on dirty code
      - name: Fail on style issues
        if: steps.fmt.outcome == 'failure'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "::error::Code style issues were found and auto-fixed."
            echo "::error::A new commit has been pushed to this PR — the workflow will re-run automatically."
          else
            echo "::error::Code style issues found on production. Fix locally and re-push."
          fi
          exit 1
