name: 🚀 Deploy to Production

on:
  push:
    branches:
      - production

jobs:
  deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # ── 1. Código fuente ─────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Autenticación GHCR ────────────────────────────────────
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 3. Build multi-stage (Client + API) y push ───────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: RugbyEngine.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/rugbyengine:latest
            ghcr.io/${{ github.repository_owner }}/rugbyengine:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── 4. Copiar archivos de infraestructura a la VM ────────────
      - name: Copy infra files to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "RugbyEngine.Api/docker-compose.yml,RugbyEngine.Api/Caddyfile"
          target: ~/rugbyengine/
          strip_components: 1

      # ── 5. Deploy en la VM ────────────────────────────────────────
      - name: Deploy and restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_TOKEN,GITHUB_ACTOR
          script: |
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            cd ~/rugbyengine
            docker compose pull rugbyengine
            docker compose up -d --remove-orphans
            docker image prune -f
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
