<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RugbyEngine</title>
    <base href="/" />
    <meta name="theme-color" content="#1976D2" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RugbyEngine" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="images/loadingPelota.ico" />
    <link rel="preload" id="webassembly" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link href="css/loading-blazor.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @theme {
            --font-sans: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
            --color-primary: #1976D2;
            --color-primary-dark: #1565C0;
            --color-secondary: #6c757d;
            --color-success: #16a34a;
            --color-danger: #dc2626;
            --color-warning: #ffc107;
            --color-muted: #6c757d;
        }

        @layer components {
            /* ── Buttons ──────────────────────── */
            .btn {
                @apply inline-flex items-center justify-center px-4 py-2 text-sm font-semibold leading-normal rounded-lg border border-transparent cursor-pointer no-underline whitespace-nowrap select-none;
                transition: background .15s, box-shadow .15s, opacity .15s;
            }
            .btn:disabled { @apply opacity-55 pointer-events-none; }
            .btn-primary { @apply bg-primary text-white border-primary hover:bg-primary-dark hover:border-primary-dark; }
            .btn-secondary { @apply bg-secondary text-white border-secondary hover:opacity-85; }
            .btn-danger { @apply bg-danger text-white border-danger hover:opacity-85; }
            .btn-link { @apply bg-transparent border-transparent text-primary px-2 py-1 no-underline hover:underline hover:opacity-85; }
            .btn-sm { @apply px-2.5 py-1.5 text-xs rounded-md; }
            .btn-outline-primary { @apply bg-transparent text-primary border-primary hover:bg-primary hover:text-white; }
            .btn-outline-secondary { @apply bg-transparent text-secondary border-secondary hover:bg-secondary hover:text-white; }
            .btn-outline-danger { @apply bg-transparent text-danger border-danger hover:bg-danger hover:text-white; }
            .btn-outline-success { @apply bg-transparent text-success border-success hover:bg-success hover:text-white; }
            .btn-close {
                @apply inline-flex items-center justify-center w-6 h-6 p-0 border-0 rounded cursor-pointer opacity-50 hover:opacity-80;
                background: transparent url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='%23000'%3e%3cpath d='M.293.293a1 1 0 0 1 1.414 0L8 6.586 14.293.293a1 1 0 1 1 1.414 1.414L9.414 8l6.293 6.293a1 1 0 0 1-1.414 1.414L8 9.414l-6.293 6.293a1 1 0 0 1-1.414-1.414L6.586 8 .293 1.707a1 1 0 0 1 0-1.414z'/%3e%3c/svg%3e") center/.65em no-repeat;
            }
            .btn-action { min-height: 40px; }
            @media (max-width: 575.98px) { .btn-action { min-height: 44px; } }

            /* ── Forms ────────────────────────── */
            .form-control {
                @apply block w-full px-3 py-2 text-base text-gray-900 bg-white border border-gray-300 rounded-lg appearance-none;
                transition: border-color .15s, box-shadow .15s;
            }
            .form-control:focus { @apply border-primary outline-none ring-2 ring-primary/25; }
            .form-control-sm { @apply px-2.5 py-1.5 text-xs rounded-md; }
            .form-select {
                @apply block w-full py-2 pl-3 pr-8 text-base text-gray-900 bg-white border border-gray-300 rounded-lg appearance-none;
                background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%23343a40' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='m2 5 6 6 6-6'/%3e%3c/svg%3e");
                background-repeat: no-repeat;
                background-position: right .75rem center;
                background-size: 12px 12px;
                transition: border-color .15s, box-shadow .15s;
            }
            .form-select:focus { @apply border-primary outline-none ring-2 ring-primary/25; }
            .form-select-sm { @apply py-1.5 pl-2.5 pr-8 text-xs rounded-md; }
            .form-label { @apply block mb-1 font-medium text-sm; }

            /* ── Cards ────────────────────────── */
            .card { @apply bg-white border border-gray-200 rounded-xl; }
            .card-body { @apply p-4; }

            /* ── Alerts ───────────────────────── */
            .alert { @apply px-4 py-3 border border-transparent rounded-lg text-sm mb-4; }
            .alert-danger { @apply bg-red-50 text-red-800 border-red-200; }
            .alert-success { @apply bg-green-50 text-green-800 border-green-200; }
            .alert-warning { @apply bg-yellow-50 text-yellow-800 border-yellow-200; }

            /* ── Badges ───────────────────────── */
            .badge { @apply inline-flex items-center px-2 py-0.5 text-xs font-bold leading-none rounded whitespace-nowrap; }
            .badge.bg-primary { @apply bg-primary text-white; }
            .badge.bg-secondary { @apply bg-secondary text-white; }
            .badge.bg-success { @apply bg-success text-white; }
            .badge.bg-danger { @apply bg-danger text-white; }

            /* ── List group ────────────────────── */
            .list-group { @apply flex flex-col p-0 m-0 list-none; }
            .list-group-flush .list-group-item { @apply border-x-0 rounded-none; }
            .list-group-item { @apply px-4 py-2.5 border-b border-gray-200; }
            .list-group-item:last-child { @apply border-b-0; }

            /* ── Spinner ──────────────────────── */
            .spinner-border {
                @apply inline-block w-5 h-5 rounded-full border-2 border-current;
                border-right-color: transparent;
                animation: spin .75s linear infinite;
            }
            .spinner-border-sm { @apply w-3.5 h-3.5; border-width: .15em; }

            /* ── Dropdown (CSS only) ──────────── */
            .dropdown { @apply relative inline-flex; }
            .dropdown-toggle::after {
                content: "";
                @apply inline-block ml-1.5;
                vertical-align: .2em;
                border-top: .3em solid;
                border-right: .3em solid transparent;
                border-left: .3em solid transparent;
            }
            .dropdown-menu { @apply absolute top-full left-0 z-50 hidden min-w-40 py-1 bg-white border border-gray-200 rounded-lg shadow-lg; }
            .dropdown:focus-within > .dropdown-menu { @apply block; }
            .dropdown-item { @apply block w-full px-4 py-1.5 text-sm text-gray-900 no-underline whitespace-nowrap bg-transparent border-0; }
            .dropdown-item:hover { @apply text-primary; background: rgba(25,118,210,.07); }

            /* ── Tables ───────────────────────── */
            .table { @apply w-full border-collapse; }
            .table > :not(caption) > * > * { @apply px-3 py-3 border-b border-gray-200; }
            .table-hover > tbody > tr { @apply transition-colors duration-100; }
            .table-hover > tbody > tr:hover { background-color: rgba(0,0,0,.04); }
            .table-striped > tbody > tr:nth-of-type(odd) > * { background-color: rgba(0,0,0,.025); }
            .table-light th { @apply bg-gray-50; }
        }
    </style>
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/x-icon" href="images/loadingPelota.ico" />
    <link href="RugbyEngine.Client.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="loading-container" style="height: 100vh;">
            <img src="images/loadingPelota.svg" alt="Cargando..." class="loading-svg loading-svg-index" />
        </div>
    </div>

    <div id="blazor-error-ui">
        Ocurrió un error inesperado.
        <a href="." class="reload">Recargar</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="js/cookieInterop.js"></script>
    <script src="js/storageInterop.js"></script>
    <script src="js/sessionMonitor.js"></script>

    <script>
        (function () {
            var isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
            if (!isLocalhost) {
                return;
            }

            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(function (registrations) {
                    registrations.forEach(function (registration) {
                        registration.unregister();
                    });
                });
            }

            if ('caches' in window) {
                caches.keys().then(function (keys) {
                    keys.forEach(function (key) {
                        caches.delete(key);
                    });
                });
            }
        })();
    </script>

    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
